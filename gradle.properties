# Opt out of AGP 9's built-in Kotlin so we can use the standalone KGP.
android.builtInKotlin=false
android.newDsl=false

# Enable AndroidX libraries (AppCompat, Core-KTX, ConstraintLayout, etc.)
android.useAndroidX=true

# Do not auto-migrate third-party libs that still use old support library symbols.
android.enableJetifier=false

# Use non-transitive R classes - smaller, faster builds.
android.nonTransitiveRClass=true

# Give Gradle enough heap for the Kotlin compiler on CI runners.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8

# Cache build outputs between CI runs.
org.gradle.caching=true

# Parallel task execution.
org.gradle.parallel=true

# Fail fast on Kotlin warnings we care about.
kotlin.code.style=official
