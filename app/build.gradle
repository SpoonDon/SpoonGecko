plugins {
    id 'com.android.application'
}

// Signing credentials come from env vars (injected by GitHub Actions from
// repository secrets). When they're absent — e.g. a local debug build —
// the release signing config is skipped and only debug builds are signed.
def keystorePath       = System.getenv("KEYSTORE_PATH")
def keystorePassword   = System.getenv("KEYSTORE_PASSWORD")
def keyAliasValue      = System.getenv("KEY_ALIAS")
def keyPasswordValue   = System.getenv("KEY_PASSWORD")

android {
    namespace 'com.spoongecko.app'
    compileSdk 37

    defaultConfig {
        applicationId "com.spoongecko.app"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0.0"

        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    signingConfigs {
        release {
            if (keystorePath != null && !keystorePath.isEmpty()) {
                storeFile file(keystorePath)
                storePassword keystorePassword
                keyAlias keyAliasValue
                keyPassword keyPasswordValue
            }
        }
    }

    buildTypes {
        debug {
            debuggable true
            minifyEnabled false
        }
        release {
            debuggable false
            minifyEnabled false
            if (keystorePath != null && !keystorePath.isEmpty()) {
                signingConfig signingConfigs.release
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
        resources {
            excludes += [
                'META-INF/DEPENDENCIES',
                'META-INF/LICENSE',
                'META-INF/LICENSE.txt',
                'META-INF/NOTICE',
                'META-INF/NOTICE.txt'
            ]
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core:1.15.0'
    implementation 'androidx.annotation:annotation:1.9.1'

    implementation 'org.mozilla.geckoview:geckoview:157.0.20260924084938'

    constraints {
        implementation('org.jetbrains.kotlin:kotlin-stdlib:2.2.0') {
            because 'Pin kotlin-stdlib to match GeckoView 157 expectations'
        }
    }
}
