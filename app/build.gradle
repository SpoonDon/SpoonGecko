plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.spoongecko.browser'
    compileSdk 37

    defaultConfig {
        applicationId "com.spoongecko.browser"
        minSdk 26
        targetSdk 35

        // Read version from CI, fall back to defaults for local builds.
        versionCode = (project.findProperty("versionCode") ?: "1").toString().toInteger()
        versionName = project.findProperty("versionName") ?: "1.0"

        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'org.mozilla.geckoview:geckoview-arm64-v8a:158.0.20261007201254'
    implementation 'androidx.core:core-ktx:1.16.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
}
