plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.spoongecko.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.spoongecko.app"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
        
        // Optional: Explicitly define the ABI if you want a smaller APK later. 
        // For now, the default 'geckoview' dependency includes all architectures (arm64, x86_64, etc.)
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86_64'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    // Core AndroidX
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    
    // Minimal Material 3 UI
    implementation 'com.google.android.material:material:1.11.0'

    // Latest Stable GeckoView (Version 153.0)
    implementation 'org.mozilla.geckoview:geckoview:153.0.20260715202819'
}
