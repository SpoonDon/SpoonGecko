plugins {
    id 'com.android.application'
}

// Signing credentials are supplied by CI via environment variables.
// When they are absent (local builds, Codespaces without secrets), release
// builds fall back to unsigned instead of failing the configuration phase.
def spoonKeystoreFile     = System.getenv("SPOON_KEYSTORE_FILE")
def spoonKeystorePassword = System.getenv("SPOON_KEYSTORE_PASSWORD")
def spoonKeyAlias         = System.getenv("SPOON_KEY_ALIAS")
def spoonKeyPassword      = System.getenv("SPOON_KEY_PASSWORD")

def hasSigning = spoonKeystoreFile != null
        && new File(spoonKeystoreFile).exists()
        && spoonKeystorePassword != null
        && spoonKeyAlias != null
        && spoonKeyPassword != null

android {
    namespace 'com.spoongecko.browser'
    compileSdk 37

    defaultConfig {
        applicationId "com.spoongecko.browser"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "0.1.0"

        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    signingConfigs {
        if (hasSigning) {
            release {
                storeFile new File(spoonKeystoreFile)
                storePassword spoonKeystorePassword
                keyAlias spoonKeyAlias
                keyPassword spoonKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            if (hasSigning) {
                signingConfig signingConfigs.release
            }

            // --- Size reduction ----------------------------------------------------
            // minifyEnabled strips Java/Kotlin code R8 proves unreachable.
            // shrinkResources removes resources no longer referenced.
            // See proguard-rules.pro for the GeckoView keep rules that keep R8
            // from stripping JNI-reachable classes.
            //
            // If the app misbehaves after enabling these, set both to false and
            // rebuild — you get a much larger but definitely-working release APK.
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro'

            // --- Native symbol stripping ------------------------------------------
            // The single biggest size win. GeckoView ships libxul.so and friends
            // WITH debug symbols (they're needed for Mozilla-side crash symbolication).
            // Stripping them here has zero runtime impact — symbols are only used
            // by NDK debuggers. Saves roughly 50-70 MB on the release APK.
            ndk {
                debugSymbolLevel 'none'
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        jniLibs {
            useLegacyPackaging = false
        }
        resources {
            excludes += [
                    'META-INF/DEPENDENCIES',
                    'META-INF/LICENSE',
                    'META-INF/LICENSE.txt',
                    'META-INF/NOTICE',
                    'META-INF/NOTICE.txt'
            ]
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'org.mozilla.geckoview:geckoview:157.0.20261005135250'
}
