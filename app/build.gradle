plugins {
    id 'com.android.application'
}

// ------------------------------------------------------------------
// Version automation (no PC / web-UI workflow):
//
// CI derives both values from the git tag that triggered the build
// (tag v1.2.3  ->  versionName "1.2.3") and passes them as environment
// variables. -P command-line properties win, then environment variables,
// then the hardcoded fallbacks below for plain local builds.
//
// versionCode uses the GitHub run number in CI: it increases on EVERY
// build, so a new APK can always be installed over any previously
// installed one (Android rejects downgrades).
// ------------------------------------------------------------------
def appVersionName = (project.findProperty('APP_VERSION_NAME')
        ?: System.getenv('APP_VERSION_NAME')
        ?: '0.0.1').toString()

def appVersionCode = (project.findProperty('APP_VERSION_CODE')
        ?: System.getenv('APP_VERSION_CODE')
        ?: '1').toString().toInteger()

android {
    namespace 'com.spoongecko.browser'
    compileSdk 37

    defaultConfig {
        applicationId "com.spoongecko.browser"
        minSdk 26
        targetSdk 37
        versionCode appVersionCode
        versionName appVersionName

        ndk {
            // GeckoView 158 ships arm64-v8a, armeabi-v7a and x86_64.
            // arm64-v8a covers virtually every phone sold since 2018.
            // If you ever need to run the app on a 32-bit phone or an x86_64
            // emulator, add 'armeabi-v7a' or 'x86_64' here (bigger APK).
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            // [STARTUP FIX] Code shrinking stays OFF until the app is
            // confirmed launching on your device. Once it starts reliably,
            // set both back to true — app/proguard-rules.pro is already
            // prepared with the complete rule set.
            minifyEnabled true
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    androidResources {
        noCompress += ['ja']
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
        resources {
            excludes += [
                'META-INF/*.kotlin_module',
                'META-INF/*.version',
                'META-INF/DEPENDENCIES',
                'META-INF/LICENSE*',
                'META-INF/NOTICE*',
                'META-INF/AL2.0',
                'META-INF/LGPL2.1'
            ]
        }
    }
}

dependencies {
    implementation 'org.mozilla.geckoview:geckoview:158.0.20261007201254'
    // WebExtensions auto-update background checks (uses androidx, already enabled in gradle.properties)
    implementation 'androidx.work:work-runtime:2.10.0'
}
