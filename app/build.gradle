plugins {
    id 'com.android.application'
}

android {
    namespace 'com.spoongecko.browser'
    compileSdk 37

    defaultConfig {
        applicationId "com.spoongecko.browser"
        minSdk 26
        targetSdk 37
        versionCode 1
        versionName "0.0.1"

        ndk {
            // GeckoView 158 ships arm64-v8a, armeabi-v7a and x86_64.
            // arm64-v8a covers virtually every phone sold since 2018.
            // If you ever need to run the app on a 32-bit phone or an x86_64
            // emulator, add 'armeabi-v7a' or 'x86_64' here (bigger APK).
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            // [STARTUP FIX] Code shrinking stays OFF until the app is
            // confirmed launching on your device. Once it starts reliably,
            // set both back to true — app/proguard-rules.pro is already
            // prepared with the complete rule set.
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    androidResources {
        noCompress += ['ja']
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
        resources {
            excludes += [
                'META-INF/*.kotlin_module',
                'META-INF/*.version',
                'META-INF/DEPENDENCIES',
                'META-INF/LICENSE*',
                'META-INF/NOTICE*',
                'META-INF/AL2.0',
                'META-INF/LGPL2.1'
            ]
        }
    }
}

dependencies {
    implementation 'org.mozilla.geckoview:geckoview:158.0.20261007201254'
    // WebExtensions auto-update background checks (uses androidx, already enabled in gradle.properties)
    implementation 'androidx.work:work-runtime:2.10.0'
}
