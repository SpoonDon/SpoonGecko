plugins {
    id 'com.android.application'
}

android {
    namespace 'com.spoongecko.app'
    compileSdk 36

    defaultConfig {
        applicationId "com.spoongecko.app"
        minSdk 34
        targetSdk 36
        versionCode (project.findProperty('versionCode')?.toString()?.toInteger() ?: 1)
        versionName (project.findProperty('versionName')?.toString() ?: "0.0.1-dev")
        ndk { abiFilters 'arm64-v8a' }
    }

    signingConfigs {
        release {
            storeFile file(System.getenv("KEYSTORE_FILE") ?: "dummy.jks")
            storePassword System.getenv("KEYSTORE_PASSWORD") ?: "dummy"
            keyAlias System.getenv("KEY_ALIAS") ?: "dummy"
            keyPassword System.getenv("KEY_PASSWORD") ?: "dummy"
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.15.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
    implementation 'com.google.android.material:material:1.12.0'
    
    implementation 'org.mozilla.geckoview:geckoview-arm64-v8a:153.0.20260803132010'
    
    testImplementation 'junit:junit:4.13.2'
}

configurations.all {
    resolutionStrategy {
        force 'org.jetbrains.kotlin:kotlin-stdlib:2.1.0'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:2.1.0'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:2.1.0'
    }
}
