plugins {
    id 'com.android.application'
}

def spoonKeystoreFile     = System.getenv("SPOON_KEYSTORE_FILE")
def spoonKeystorePassword = System.getenv("SPOON_KEYSTORE_PASSWORD")
def spoonKeyAlias         = System.getenv("SPOON_KEY_ALIAS")
def spoonKeyPassword      = System.getenv("SPOON_KEY_PASSWORD")

def hasSigning = spoonKeystoreFile != null
        && new File(spoonKeystoreFile).exists()
        && spoonKeystorePassword != null
        && spoonKeyAlias != null
        && spoonKeyPassword != null

android {
    namespace 'com.spoongecko.browser'
    compileSdk 37

    defaultConfig {
        applicationId "com.spoongecko.browser"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "0.1.0"

        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    signingConfigs {
        if (hasSigning) {
            release {
                storeFile new File(spoonKeystoreFile)
                storePassword spoonKeystorePassword
                keyAlias spoonKeyAlias
                keyPassword spoonKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            if (hasSigning) {
                signingConfig signingConfigs.release
            }

            // R8 / shrinkResources OFF per your testing: they don't help against
            // native library weight, and shrinkResources alone breaks GeckoView.
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro'

            ndk {
                debugSymbolLevel 'none'    // strip native symbols on release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        jniLibs {
            // THIS IS THE BIG ONE.
            // false = .so files stored UNCOMPRESSED in the APK (mmap-friendly,
            //         fast install, ~200 MB APK for GeckoView).
            // true  = .so files COMPRESSED inside the APK (smaller download,
            //         a few hundred ms extra on first install while Android
            //         extracts them to /data).
            useLegacyPackaging = true
        }
        resources {
            excludes += [
                    'META-INF/DEPENDENCIES',
                    'META-INF/LICENSE',
                    'META-INF/LICENSE.txt',
                    'META-INF/NOTICE',
                    'META-INF/NOTICE.txt'
            ]
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    // ABI-specific artifact — guarantees only arm64-v8a native libs are on the
    // classpath, independent of abiFilters behaviour.
    implementation 'org.mozilla.geckoview:geckoview-arm64-v8a:157.0.20261005135250'
}
