plugins {
    id 'com.android.application'
}

// Environment flag: set EXTENSIONS_ENABLED=false to ship a build without extension support.
def extensionsEnabled = System.getenv("EXTENSIONS_ENABLED") != null
        ? System.getenv("EXTENSIONS_ENABLED").toBoolean()
        : true

def getCommitCount = {
    try {
        def stdout = new ByteArrayOutputStream()
        exec {
            commandLine 'git', 'rev-list', '--count', 'HEAD'
            standardOutput = stdout
        }
        return stdout.toString().trim().toInteger()
    } catch (e) {
        return 1
    }
}

def commitCount = getCommitCount()
def offset = 531
def counter = Math.max(1, commitCount - offset)

def envVersion = System.getenv("VERSION_NAME")
def envCode = System.getenv("VERSION_CODE")

def versionNameValue = (envVersion != null && !envVersion.isEmpty())
        ? envVersion
        : "0.${counter.intdiv(10)}.${counter % 10}"

def versionCodeValue = (envCode != null && !envCode.isEmpty())
        ? envCode.toInteger()
        : counter

android {
    namespace 'com.spoongecko.app'
    compileSdk 36

    defaultConfig {
        applicationId "com.spoongecko.app"
        minSdk 34
        targetSdk 36
        versionCode versionCodeValue
        versionName versionNameValue
        buildConfigField "boolean", "EXTENSIONS_ENABLED", "${extensionsEnabled}"
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        release {
            storeFile file("release.keystore")
            storePassword System.getenv("KEYSTORE_PASSWORD") ?: ""
            keyAlias System.getenv("KEY_ALIAS") ?: ""
            keyPassword System.getenv("KEY_PASSWORD") ?: ""
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            outputFileName = "SpoonGecko v${variant.versionName}.apk"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.core:core:1.13.1'
    implementation 'org.mozilla.geckoview:geckoview-arm64-v8a:153.0.20260803132010'
    testImplementation 'junit:junit:4.13.2'
}
