plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.spoongecko.app'
    compileSdk 35

    defaultConfig {
        applicationId "com.spoongecko.app"
        minSdk 26 // Kept at 26 for broader compatibility, but targets modern behavior
        targetSdk 35
        versionCode 1
        versionName "1.0.0"
        
        // Build ONLY for 64-bit ARM (massive APK size reduction)
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
0
        }
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    // Core AndroidX (Stable, non-conflicting versions)
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    
    // Minimal Material 3 UI
    implementation 'com.google.android.material:material:1.12.0'

    // Mature, Field-Tested GeckoView (December 2024 release, highly stable)
    implementation 'org.mozilla.geckoview:geckoview:134.0.20241212143137'
}
