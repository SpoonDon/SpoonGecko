plugins {
    id 'com.android.application'
}

def keystorePath = System.getenv("KEYSTORE_PATH")
def keystorePassword = System.getenv("KEYSTORE_PASSWORD")
def keyAliasValue = System.getenv("KEY_ALIAS")
def keyPasswordValue = System.getenv("KEY_PASSWORD")

android {
    namespace 'com.spoongecko.app'
    compileSdk 37
    buildToolsVersion "37.0.0"

    defaultConfig {
        applicationId "com.spoongecko.app"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0.0"

        // Use ONLY this filter for a single-ABI APK. Do NOT combine with splits.
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    signingConfigs {
        release {
            if (keystorePath != null && !keystorePath.isEmpty()) {
                storeFile file(keystorePath)
                storePassword keystorePassword
                keyAlias keyAliasValue
                keyPassword keyPasswordValue
            }
        }
    }

    buildTypes {
        debug {
            debuggable true
            minifyEnabled false
        }
        release {
            debuggable false
            minifyEnabled true          // Enables R8 code shrinking
            shrinkResources true        // Enables resource shrinking (requires minifyEnabled)
            if (keystorePath != null && !keystorePath.isEmpty()) {
                signingConfig signingConfigs.release
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }

    packaging {
        jniLibs {
            // This must be false to compress native libraries in the APK.
            useLegacyPackaging = false
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core:1.15.0'
    implementation 'androidx.annotation:annotation:1.9.1'

    // GeckoView - Latest Stable
    implementation 'org.mozilla.geckoview:geckoview:156.0.20260921121718'
}
