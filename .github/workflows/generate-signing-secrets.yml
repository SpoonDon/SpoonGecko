name: Generate Signing Secrets (One‑Time)

on:
  workflow_dispatch:   # Only runs when you manually trigger it

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate Keystore
        run: |
          # Use fixed but random‑looking passwords; you can change them if you wish.
          KEYSTORE_PASS="SpoonGecko-$(openssl rand -hex 8)"
          KEY_PASS="$KEYSTORE_PASS"   # same password for simplicity
          ALIAS="spoongecko"

          echo "🔐 Generating keystore..."
          keytool -genkey -v \
            -keystore spoongecko-release.jks \
            -keyalg RSA \
            -keysize 4096 \
            -validity 10000 \
            -alias "$ALIAS" \
            -storetype JKS \
            -storepass "$KEYSTORE_PASS" \
            -keypass "$KEY_PASS" \
            -dname "CN=SpoonGecko, OU=Development, O=SpoonGecko, L=Unknown, ST=Unknown, C=US"

          echo "✅ Keystore generated."

          # Store the passwords as environment variables for later steps
          echo "KEYSTORE_PASSWORD=$KEYSTORE_PASS" >> $GITHUB_ENV
          echo "KEY_PASSWORD=$KEY_PASS" >> $GITHUB_ENV
          echo "KEY_ALIAS=$ALIAS" >> $GITHUB_ENV

      - name: Encode Keystore to Base64
        run: |
          echo "📦 Encoding keystore to Base64..."
          base64 -w 0 spoongecko-release.jks > keystore.b64
          echo "✅ Base64 file created."
          # Save the Base64 string as an environment variable for later
          echo "KEYSTORE_BASE64=$(cat keystore.b64)" >> $GITHUB_ENV

      - name: Print Secrets to Workflow Log
        run: |
          echo "============================================================"
          echo "🔑 COPY THE FOLLOWING VALUES INTO YOUR REPOSITORY SECRETS"
          echo "============================================================"
          echo ""
          echo "Secret name: KEYSTORE_BASE64"
          echo "Secret value:"
          echo "$KEYSTORE_BASE64"
          echo ""
          echo "Secret name: KEYSTORE_PASSWORD"
          echo "Secret value: $KEYSTORE_PASSWORD"
          echo ""
          echo "Secret name: KEY_ALIAS"
          echo "Secret value: $KEY_ALIAS"
          echo ""
          echo "Secret name: KEY_PASSWORD"
          echo "Secret value: $KEY_PASSWORD"
          echo ""
          echo "============================================================"
          echo "⚠️  AFTER COPYING, DELETE THIS WORKFLOW RUN FOR SECURITY."
          echo "============================================================"

      - name: Upload Keystore as Artifact (optional)
        uses: actions/upload-artifact@v4
        with:
          name: spoongecko-keystore
          path: spoongecko-release.jks
