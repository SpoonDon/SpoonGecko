name: Build and Analyze Android Bundle

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-and-analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Inject debug signing for release analysis
        run: |
          # Injects debug signing into release build so bundleRelease doesn't fail on CI
          sed -i 's/release {/release {\n            signingConfig signingConfigs.debug/g' app/build.gradle

      - name: Show Java and Gradle versions
        run: |
          java -version
          ./gradlew -v

      - name: Build release AAB
        run: |
          ./gradlew clean bundleRelease --no-daemon --stacktrace

      - name: Download bundletool
        run: |
          BUNDLETOOL=bundletool.jar
          wget -q https://github.com/google/bundletool/releases/download/1.17.0/bundletool-all-1.17.0.jar -O $BUNDLETOOL
          echo "BUNDLETOOL=$PWD/$BUNDLETOOL" >> $GITHUB_ENV

      - name: Create universal APK from AAB (for analysis)
        run: |
          AAB=$(find . -type f -path "*/app/build/outputs/bundle/release/*.aab" | head -n1)
          if [ -z "$AAB" ]; then
            echo "AAB not found"
            exit 1
          fi
          echo "Found AAB: $AAB"
          java -jar $BUNDLETOOL build-apks --bundle="$AAB" --output=app.apks --mode=universal
          unzip -q app.apks universal.apk -d .
          ls -lh universal.apk

      - name: Add apkanalyzer to PATH
        run: |
          BUILD_TOOLS_PATH=$(ls -d $ANDROID_SDK_ROOT/build-tools/* 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$BUILD_TOOLS_PATH" ]; then
            echo "Adding $BUILD_TOOLS_PATH to PATH"
            echo "$BUILD_TOOLS_PATH" >> $GITHUB_PATH
          else
            echo "Warning: Could not find build-tools path"
          fi

      - name: Run apkanalyzer and produce size report
        run: |
          APK=universal.apk
          echo "APK: $APK"
          echo "=== apkanalyzer file-size ===" > size-report.txt
          apkanalyzer apk file-size "$APK" >> size-report.txt 2>&1 || true
          echo "" >> size-report.txt
          echo "=== apkanalyzer tree (top lines) ===" >> size-report.txt
          apkanalyzer apk tree "$APK" | sed -n '1,200p' >> size-report.txt 2>&1 || true
          echo "" >> size-report.txt
          echo "=== unzip listing top 200 ===" >> size-report.txt
          unzip -l "$APK" | sort -k3 -n -r | sed -n '1,200p' >> size-report.txt 2>&1 || true
          echo "Generated size-report.txt"
          ls -lh size-report.txt

      - name: Upload artifacts (AAB, universal APK, size report)
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            app/build/outputs/bundle/release/*.aab
            universal.apk
            size-report.txt
