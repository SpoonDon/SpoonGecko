name: Init Signing Secrets (one-shot)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Generate keystore with random passwords
        id: gen
        run: |
          set -euo pipefail
          PASS="$(openssl rand -base64 48 | tr -dc 'A-Za-z0-9' | head -c 32)"
          echo "::add-mask::$PASS"
          keytool -genkeypair -v \
            -keystore release.keystore \
            -alias spoongecko \
            -keyalg RSA -keysize 4096 -validity 10000 \
            -storepass "$PASS" \
            -keypass "$PASS" \
            -dname "CN=SpoonGecko, OU=Mobile, O=SpoonGecko, L=Unknown, S=Unknown, C=IN"
          echo "pass=$PASS" >> "$GITHUB_OUTPUT"

      - name: Push four secrets to this repo
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_FOR_SECRETS }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          base64 -w0 release.keystore | gh secret set KEYSTORE_BASE64
          gh secret set KEYSTORE_PASSWORD --body "${{ steps.gen.outputs.pass }}"
          gh secret set KEY_ALIAS --body 'spoongecko'
          gh secret set KEY_PASSWORD --body "${{ steps.gen.outputs.pass }}"

      - name: Confirm secrets exist
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_FOR_SECRETS }}
          GH_REPO: ${{ github.repository }}
        run: gh secret list

      - name: Delete the PAT secret (self-cleanup)
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_FOR_SECRETS }}
          GH_REPO: ${{ github.repository }}
        run: gh secret delete GH_PAT_FOR_SECRETS

      - name: Remove keystore from runner
        if: always()
        run: rm -f release.keystore
