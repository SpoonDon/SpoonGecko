name: Build & Release SpoonGecko

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    env:
      KEYSTORE_EXISTS: ${{ secrets.KEYSTORE_BASE64 != '' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''
          accept-android-sdk-licenses: true
          log-accepted-sdk-licenses: false

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      # ------------------------------------------------------------------
      # Version automation: THE TAG IS THE VERSION.
      #   tag v1.2.3  ->  versionName "1.2.3" in the APK
      # Non-tag builds (main / PR / manual) get a dev version with the
      # commit SHA, so they can never be confused with a release.
      #
      # versionCode = the workflow run number: it increases on EVERY build,
      # so a new APK can always be installed over any previously installed
      # one (Android refuses downgrades). No manual editing anywhere.
      # ------------------------------------------------------------------
      - name: Derive app version from tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            if ! [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+){0,3}(-[0-9A-Za-z.]+)?$ ]]; then
              echo "::error::Tag '$GITHUB_REF_NAME' is not a valid version tag. Use vMAJOR.MINOR.PATCH (e.g. v1.2.3, v1.2.3-beta.1)."
              exit 1
            fi
          else
            VERSION="0.0.0-dev.${GITHUB_SHA::7}"
          fi
          echo "APP_VERSION_NAME=$VERSION" >> "$GITHUB_ENV"
          echo "APP_VERSION_CODE=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          {
            echo "### SpoonGecko build"
            echo "- versionName: \`$VERSION\`"
            echo "- versionCode: \`$GITHUB_RUN_NUMBER\`"
            echo "- built from: \`${GITHUB_SHA::7}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Decode keystore
        if: env.KEYSTORE_EXISTS == 'true'
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/release.jks"

      # [C5] Diagnostic build: debug-signed, no code shrinking. If the debug
      # APK starts but the release one does not, the difference is in the
      # release build settings (R8/ProGuard), not in the code.
      # (Kept as a separate invocation on purpose: the injected signing
      # properties below must not touch the debug APK.)
      - name: Build debug APK (diagnostic)
        run: gradle assembleDebug --no-daemon

      - name: Build signed release APK
        if: env.KEYSTORE_EXISTS == 'true'
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          gradle assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$KEYSTORE_FILE" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Build unsigned release APK
        if: env.KEYSTORE_EXISTS != 'true'
        run: gradle assembleRelease --no-daemon

      # ------------------------------------------------------------------
      # Give the APKs descriptive names (version included) so a downloaded
      # file is identifiable without opening it, and so a GitHub Release
      # shows "SpoonGecko-v1.2.3.apk" instead of "app-release.apk".
      # ------------------------------------------------------------------
      - name: Rename APKs with version
        run: |
          cd app/build/outputs/apk
          if [ -f debug/app-debug.apk ]; then
            mv debug/app-debug.apk "debug/SpoonGecko-v${APP_VERSION_NAME}-debug.apk"
          fi
          if [ -f release/app-release.apk ]; then
            mv release/app-release.apk "release/SpoonGecko-v${APP_VERSION_NAME}.apk"
          elif [ -f release/app-release-unsigned.apk ]; then
            mv release/app-release-unsigned.apk "release/SpoonGecko-v${APP_VERSION_NAME}-unsigned.apk"
          fi
          ls -la debug release

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpoonGecko-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpoonGecko-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') && env.KEYSTORE_EXISTS == 'true'
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          files: app/build/outputs/apk/release/SpoonGecko-v*.apk
          generate_release_notes: true
          fail_on_unmatched_files: true

      # An unsigned APK cannot be installed, so attaching it to a Release
      # would only confuse users. Fail loudly (visible warning) instead.
      - name: Warn about unsigned tag build
        if: startsWith(github.ref, 'refs/tags/v') && env.KEYSTORE_EXISTS != 'true'
        run: |
          echo "::warning::Tag $GITHUB_REF_NAME was built, but no signing keystore is configured (secrets KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD), so no installable Release APK was produced."
