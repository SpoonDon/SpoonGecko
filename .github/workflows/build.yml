name: Build SpoonGecko

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Signed release APK (arm64-v8a)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Derive version from tag
        id: appver
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="0.1.0"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved app version: ${VERSION}"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        run: |
          set -e
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "SDK_ROOT=$SDK_ROOT"

          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1)
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager binary not found under $SDK_ROOT/cmdline-tools"
            exit 1
          fi
          echo "Using sdkmanager: $SDKMANAGER"

          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-37" > /dev/null 2>&1 || true

          echo "--- platforms installed ---"
          ls "$SDK_ROOT/platforms" || true

      - name: Decode keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Secret KEYSTORE_BASE64 is empty or not set on this repository."
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$GITHUB_WORKSPACE/release.keystore"
          ls -l "$GITHUB_WORKSPACE/release.keystore"

      - name: Set up Gradle 9.8.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.0'
          validate-wrappers: false

      - name: Build signed release APK
        env:
          SPOON_KEYSTORE_FILE: ${{ github.workspace }}/release.keystore
          SPOON_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SPOON_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SPOON_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon --stacktrace -PappVersionName=${{ steps.appver.outputs.version }}

      - name: Verify signature
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          test -f "$APK" || { echo "::error::APK not produced at $APK"; exit 1; }
          BUILD_TOOLS=$(ls -d /usr/local/lib/android/sdk/build-tools/* 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$BUILD_TOOLS" ] && [ -x "$BUILD_TOOLS/apksigner" ]; then
            "$BUILD_TOOLS/apksigner" verify --print-certs "$APK"
          else
            echo "apksigner not found, skipping cert dump"
          fi

      - name: Collect APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/SpoonGecko-arm64-v8a-release.apk
          ls -lh out

      - name: Shred keystore
        if: always()
        run: shred -u "$GITHUB_WORKSPACE/release.keystore" || rm -f "$GITHUB_WORKSPACE/release.keystore"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpoonGecko-release-apk
          path: out/SpoonGecko-arm64-v8a-release.apk
          if-no-files-found: error

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/SpoonGecko-arm64-v8a-release.apk
          generate_release_notes: true
