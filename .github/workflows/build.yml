name: Build SpoonGecko APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.13

      - name: Install Android SDK command-line tools
        run: |
          mkdir -p "$HOME/android-sdk/cmdline-tools"
          cd "$HOME/android-sdk/cmdline-tools"
          curl -sSL -o cmdtools.zip "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          unzip -q cmdtools.zip
          mv cmdline-tools latest
          echo "ANDROID_HOME=$HOME/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> "$GITHUB_ENV"
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Accept licenses and install SDK components
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - name: Generate CI signing key
        run: |
          mkdir -p ci-signing
          keytool -genkeypair -v \
            -keystore ci-signing/ci.keystore \
            -alias spoongecko-ci \
            -keyalg RSA -keysize 2048 -validity 36500 \
            -storepass spoongecko \
            -keypass spoongecko \
            -dname "CN=SpoonGecko CI, OU=CI, O=SpoonGecko, L=Unknown, ST=Unknown, C=US"
          echo "KEYSTORE_FILE=$(pwd)/ci-signing/ci.keystore" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=spoongecko" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=spoongecko-ci" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=spoongecko" >> "$GITHUB_ENV"

      - name: Build release APK
        run: |
          gradle assembleRelease --no-daemon --stacktrace \
            -Pandroid.injected.signing.store.file="$KEYSTORE_FILE" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpoonGecko-arm64-v8a
          path: app/build/outputs/apk/release/*.apk
