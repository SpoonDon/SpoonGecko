name: Build SpoonGecko

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK (base tools only)
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: platform-tools

      - name: Install Android platform 36 + build-tools
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
          echo "=== Installed platforms ==="
          ls -1 "$ANDROID_HOME/platforms" || true
          echo "=== Installed build-tools ==="
          ls -1 "$ANDROID_HOME/build-tools" || true

      - name: Set up Gradle 9.8.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.0'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SpoonGecko-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
