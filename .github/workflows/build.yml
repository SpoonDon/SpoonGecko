name: Build SpoonGecko

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: platform-tools

      - name: Install Android platform 37 + build-tools 37
        run: |
          sdkmanager --install "platforms;android-37" "build-tools;37.0.0"
          echo "=== Installed platforms ==="
          ls -1 "$ANDROID_HOME/platforms" || true
          echo "=== Installed build-tools ==="
          ls -1 "$ANDROID_HOME/build-tools" || true

      - name: Determine version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            RAW_TAG="${GITHUB_REF_NAME}"
            VER="${RAW_TAG#v}"
            BASE_VER="${VER%%-*}"
            CODE=$(echo "$BASE_VER" | awk -F. '{printf "%d%02d%02d", $1, $2, $3}')
          else
            RAW_TAG=""
            VER="0.0.${GITHUB_RUN_NUMBER}-dev"
            CODE="${GITHUB_RUN_NUMBER}"
          fi
          echo "tag=$RAW_TAG"     >> "$GITHUB_OUTPUT"
          echo "name=$VER"        >> "$GITHUB_OUTPUT"
          echo "code=${CODE}"     >> "$GITHUB_OUTPUT"
          echo "Resolved version: $VER (versionCode $CODE)"

      - name: Decode release keystore
        run: |
          if [ -z "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "ERROR: KEYSTORE_BASE64 secret is not set"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/keystore"
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/keystore/release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/keystore/release.jks" >> "$GITHUB_ENV"

      - name: Set up Gradle 9.8.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.0'

      - name: Build signed release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS:         ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD:      ${{ secrets.KEY_PASSWORD }}
        run: |
          gradle assembleRelease --no-daemon --stacktrace \
            -PappVersionName="${{ steps.version.outputs.name }}" \
            -PappVersionCode="${{ steps.version.outputs.code }}"

      - name: Prepare APK for upload
        run: |
          mkdir -p dist
          SRC=$(find app/build/outputs/apk/release -name "*.apk" -type f | head -n 1)
          if [ -z "$SRC" ]; then
            echo "ERROR: no APK found"
            ls -la app/build/outputs/apk/release/ || true
            exit 1
          fi
          DEST="dist/SpoonGecko-${{ steps.version.outputs.name }}-arm64-v8a.apk"
          cp "$SRC" "$DEST"
          echo "Created $DEST"
          ls -la dist/

      - name: Upload APK as workflow artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: SpoonGecko-${{ steps.version.outputs.name }}
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
