name: Build SpoonGecko

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

# Only one run per branch/tag ref at a time. Pushing again while a build is
# still going cancels the older run. Tag builds are on their own ref, so a
# branch push cannot cancel an in-flight release build.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK (base tools only)
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: platform-tools

      - name: Install Android platform 37 + build-tools
        run: |
          sdkmanager --install "platforms;android-37.0" "build-tools;37.0.0"
          echo "=== Installed platforms ==="
          ls -1 "$ANDROID_HOME/platforms" || true
          echo "=== Installed build-tools ==="
          ls -1 "$ANDROID_HOME/build-tools" || true

      - name: Determine version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            RAW_TAG="${GITHUB_REF_NAME}"
            # Strip the leading "v" so versionName is "1.0.0", not "v1.0.0".
            VER="${RAW_TAG#v}"
          else
            RAW_TAG=""
            VER="0.0.${GITHUB_RUN_NUMBER}-dev"
          fi
          echo "tag=$RAW_TAG"              >> "$GITHUB_OUTPUT"
          echo "name=$VER"                 >> "$GITHUB_OUTPUT"
          echo "code=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $VER (versionCode ${GITHUB_RUN_NUMBER})"

      - name: Decode release keystore
        run: |
          if [ -z "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "ERROR: KEYSTORE_BASE64 secret is not set"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/keystore"
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/keystore/release.jks"
          echo "Keystore decoded to $RUNNER_TEMP/keystore/release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/keystore/release.jks" >> "$GITHUB_ENV"

      - name: Set up Gradle 9.8.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.0'

      - name: Build signed release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS:         ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD:      ${{ secrets.KEY_PASSWORD }}
        run: |
          gradle assembleRelease --no-daemon --stacktrace \
            -PappVersionName="${{ steps.version.outputs.name }}" \
            -PappVersionCode="${{ steps.version.outputs.code }}"

      - name: Rename APK to match version
        run: |
          mkdir -p dist
          SRC="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$SRC" ]; then
            echo "ERROR: expected APK not found at $SRC"
            ls -la app/build/outputs/apk/release/ || true
            exit 1
          fi
          DEST="dist/SpoonGecko-${{ steps.version.outputs.name }}.apk"
          cp "$SRC" "$DEST"
          echo "Created $DEST"
          ls -la dist/

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpoonGecko-${{ steps.version.outputs.name }}
          path: dist/*.apk
          if-no-files-found: error

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
