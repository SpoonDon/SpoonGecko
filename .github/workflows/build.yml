name: Build Spoon Gecko APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    # ---- Generate wrapper if missing ----
    - name: Generate Gradle Wrapper
      run: |
        if [ ! -f gradlew ]; then
          echo "📦 gradlew not found – generating wrapper..."
          wget -q https://services.gradle.org/distributions/gradle-8.10-bin.zip
          unzip -q gradle-8.11.1-bin.zip
          export PATH=$PWD/gradle-8.11.1/bin:$PATH
          gradle wrapper
        fi

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build APK
      run: ./gradlew assembleDebug --no-daemon

    - name: Upload APK as artifact
      uses: actions/upload-artifact@v4
      with:
        name: SpoonGecko-debug
        path: app/build/outputs/apk/debug/*.apk
        retention-days: 30
