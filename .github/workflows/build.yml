name: Build SpoonGecko APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      - name: Install Android SDK command-line tools
        run: |
          mkdir -p "$HOME/android-sdk/cmdline-tools"
          cd "$HOME/android-sdk/cmdline-tools"
          curl -sSL -o cmdtools.zip "https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip"
          unzip -q cmdtools.zip
          mv cmdline-tools latest
          echo "ANDROID_HOME=$HOME/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> "$GITHUB_ENV"
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Accept licenses and install SDK components
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-37.0" "build-tools;36.0.0"

      - name: Create android-37 symlink for AGP
        run: |
          mkdir -p "$ANDROID_SDK_ROOT/platforms"
          ln -sfn "$ANDROID_SDK_ROOT/platforms/android-37.0" "$ANDROID_SDK_ROOT/platforms/android-37"

      - name: Verify installed platforms
        run: |
          ls -la "$ANDROID_SDK_ROOT/platforms"

      - name: Generate CI signing key
        run: |
          mkdir -p ci-signing
          keytool -genkeypair -v \
            -keystore ci-signing/ci.keystore \
            -alias spoongecko-ci \
            -keyalg RSA -keysize 2048 -validity 36500 \
            -storepass spoongecko \
            -keypass spoongecko \
            -dname "CN=SpoonGecko CI, OU=CI, O=SpoonGecko, L=Unknown, ST=Unknown, C=US"
          echo "KEYSTORE_FILE=$(pwd)/ci-signing/ci.keystore" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=spoongecko" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=spoongecko-ci" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=spoongecko" >> "$GITHUB_ENV"

      - name: Compute version name and code
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            VERSION_NAME="${TAG#v}"
          else
            VERSION_NAME="1.0.${GITHUB_RUN_NUMBER}"
          fi
          VERSION_CODE="$GITHUB_RUN_NUMBER"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        run: |
          gradle assembleRelease --no-daemon --stacktrace \
            -PversionName="$VERSION_NAME" \
            -PversionCode="$VERSION_CODE" \
            -Pandroid.injected.signing.store.file="$KEYSTORE_FILE" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Rename APK with version
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk \
             "out/SpoonGecko-${{ steps.version.outputs.name }}-arm64-v8a.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpoonGecko-${{ steps.version.outputs.name }}
          path: out/*.apk

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: SpoonGecko ${{ github.ref_name }}
          files: out/*.apk
